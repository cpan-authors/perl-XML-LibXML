name: ci

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:

  author-testing:
    name: "Author testing"
    runs-on: ubuntu-latest

    env:
      PERL_USE_UNSAFE_INC: 0
      AUTHOR_TESTING: 1
      AUTOMATED_TESTING: 1
      RELEASE_TESTING: 1

    steps:
      - name: install libxml2-dev
        run: |
          sudo apt-get update -y ||:
          sudo apt-get --no-install-recommends -y install libxml2-dev
      - uses: actions/checkout@v6
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpm@v1
        with:
          sudo: true
          cpanfile: ".github/cpanfile"
          args: "--with-develop"
      - run: perl Makefile.PL
      - run: make -j$(nproc)
      - run: make test
      - run: make disttest

  coverage:
    needs: [author-testing]
    runs-on: ubuntu-latest

    env:
      PERL_USE_UNSAFE_INC: 0
      AUTOMATED_TESTING: 1

    steps:
      - name: install libxml2-dev and lcov
        run: |
          sudo apt-get update -y ||:
          sudo apt-get --no-install-recommends -y install libxml2-dev lcov
      - uses: actions/checkout@v6
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          cpanfile: ".github/cpanfile"
      - name: Install coverage dependencies
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          install: "Devel::Cover"
      - name: Install Codecov reporter
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          install: "Devel::Cover::Report::Codecov"
      - name: Install JSON::MaybeXS
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          install: "JSON::MaybeXS"
      - name: libxml2 version
        run: pkg-config --modversion libxml-2.0 2>/dev/null || true
      - name: Build with coverage flags
        run: |
          perl Makefile.PL OPTIMIZE="-g -O0 --coverage -fprofile-arcs -ftest-coverage" \
            LDDLFLAGS="-shared --coverage"
          make -j$(nproc)
      - name: Run tests with Devel::Cover
        run: |
          HARNESS_PERL_SWITCHES="-MDevel::Cover=-coverage,statement,branch,condition,subroutine,+ignore,^t/" \
            make test
      - name: Generate Perl coverage report
        run: |
          cover -report text
          cover -report json
      - name: Generate XS/C coverage report
        run: |
          find . -name '*.gcno' -o -name '*.gcda' | head -5
          lcov --capture --directory . --output-file xs_coverage.lcov --rc lcov_branch_coverage=1 || true
          lcov --remove xs_coverage.lcov '/usr/*' --output-file xs_coverage.lcov --rc lcov_branch_coverage=1 || true
          lcov --list xs_coverage.lcov || true
      - name: Upload Perl coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover_db/cover.json
          flags: perl
          name: perl-coverage
        continue-on-error: true
      - name: Upload XS/C coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: xs_coverage.lcov
          flags: xs
          name: xs-coverage
        continue-on-error: true

  asan:
    needs: [author-testing]
    runs-on: ubuntu-latest

    env:
      PERL_USE_UNSAFE_INC: 0
      AUTOMATED_TESTING: 1

    steps:
      - name: install libxml2-dev and libasan
        run: |
          sudo apt-get update -y ||:
          sudo apt-get --no-install-recommends -y install libxml2-dev libasan8
      - uses: actions/checkout@v6
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          cpanfile: ".github/cpanfile"
      - name: Build with AddressSanitizer
        run: |
          perl Makefile.PL OPTIMIZE="-g -fsanitize=address -fno-omit-frame-pointer" \
            LDDLFLAGS="-shared -fsanitize=address"
          make -j$(nproc)
      - name: Run tests under ASan
        run: |
          ASAN_LIB=$(gcc -print-file-name=libasan.so)
          ASAN_OPTIONS="detect_leaks=0:halt_on_error=1" \
            LD_PRELOAD="$ASAN_LIB" \
            make test

  downstream:
    needs: [author-testing]
    runs-on: ubuntu-latest

    name: "downstream ${{ matrix.module }}"

    strategy:
      fail-fast: false
      matrix:
        module:
          - 'XML::LibXSLT'

    env:
      PERL_USE_UNSAFE_INC: 1
      AUTOMATED_TESTING: 1

    steps:
      - name: install system deps
        run: |
          sudo apt-get update -y ||:
          sudo apt-get --no-install-recommends -y install libxml2-dev libxslt1-dev
      - uses: actions/checkout@v6
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          cpanfile: ".github/cpanfile"
      - name: Install XML-LibXML from checkout
        run: |
          perl Makefile.PL
          make -j$(nproc)
          sudo make install
      - name: Test downstream module
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          install: ${{ matrix.module }}
          tests: true
          verbose: true

  perl-versions:
    runs-on: ubuntu-latest
    name: List Perl versions
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - id: action
        uses: perl-actions/perl-versions@v2
        with:
          since-perl: 5.8
          with-devel: true

  linux:
    name: "Perl ${{ matrix.perl-version }}"
    needs: [perl-versions, libxml2]
    runs-on: ubuntu-latest

    env:
      PERL_USE_UNSAFE_INC: 0
      AUTOMATED_TESTING: 1
      DEVELOPER: 1

    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ fromJson(needs.perl-versions.outputs.perl-versions) }}

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    steps:
      - name: install libxml2-dev
        run: |
          apt-get update -y ||:
          apt-get -y --no-install-recommends install libxml2-dev
      - uses: actions/checkout@v6
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpanm@v1
        with:
          sudo: false
          cpanfile: ".github/cpanfile"
      - run: perl Makefile.PL
      - run: make -j$(nproc)
      - run: make test
      - run: make install

  BSDs:
    needs: [author-testing, linux]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os:
          - name: freebsd
            version: '14.2'
            pkginstall: pkg install -y libxml2 pkgconf p5-ExtUtils-MakeMaker

          - name: openbsd
            version: '7.8'
            pkginstall: pkg_add libxml

          - name: netbsd
            version: '10.1'
            pkginstall: pkgin -y install libxml2 pkg-config perl || true

    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Test on ${{ matrix.os.name }}
        uses: cross-platform-actions/action@v1
        timeout-minutes: 15
        with:
          operating_system: ${{ matrix.os.name }}
          version: ${{ matrix.os.version }}
          shell: bash
          run: |
            sudo ${{ matrix.os.pkginstall }}
            pkg-config --modversion libxml-2.0 2>/dev/null || xml2-config --version 2>/dev/null || true
            curl -L https://cpanmin.us | sudo perl - --notest Alien::Libxml2 XML::NamespaceSupport XML::SAX XML::SAX::Base
            DEVELOPER=1 perl Makefile.PL
            make
            prove -wlvmb t

  fedora:
    needs: [author-testing, linux]
    runs-on: ubuntu-latest

    container:
      image: fedora:43

    env:
      PERL_USE_UNSAFE_INC: 0
      AUTOMATED_TESTING: 1
      DEVELOPER: 1

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          dnf -y install perl libxml2-devel git make gcc patch pkgconf-pkg-config
      - name: libxml2 version
        run: pkg-config --modversion libxml-2.0 2>/dev/null || rpm -q libxml2-devel || true
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: false
          cpanfile: ".github/cpanfile"
      - name: Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make -j$(nproc)
      - name: make test
        run: make test

  macOS:
    needs: [author-testing, linux]
    name: macOS
    runs-on: macos-latest

    env:
      PERL_USE_UNSAFE_INC: 0
      AUTOMATED_TESTING: 1
      DEVELOPER: 1

    steps:
      - uses: actions/checkout@v6
      - name: Set up Perl
        run: brew install perl
      - name: libxml2 version
        run: pkg-config --modversion libxml-2.0 2>/dev/null || xml2-config --version 2>/dev/null || true
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: false
          cpanfile: ".github/cpanfile"
      - run: perl Makefile.PL
      - run: make -j$(sysctl -n hw.ncpu)
      - run: make test

  windows:
    needs: [author-testing, linux]
    runs-on: windows-latest

    env:
      DEVELOPER: 1

    steps:
      - uses: actions/checkout@v6
      - name: Set up Perl
        run: |
          choco install strawberryperl
          echo @"
          C:\strawberry\c\bin
          C:\strawberry\perl\site\bin
          C:\strawberry\perl\bin
          "@ |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: perl -V
        run: perl -V
      - name: Install deps
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: false
          cpanfile: ".github/cpanfile"
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make
      - name: Run Tests
        run: make test

  libxml2:
    name: "libxml2 ${{ matrix.libxml2-version }}"
    runs-on: ubuntu-latest

    env:
      PERL_USE_UNSAFE_INC: 0
      AUTOMATED_TESTING: 1
      DEVELOPER: 1
      LIBXML2_VERSION: ${{ matrix.libxml2-version }}
      LIBXML2_INSTALL_DIR: ${{ github.workspace }}/install-${{ matrix.libxml2-version }}

    strategy:
      fail-fast: false
      matrix:
        # Version 2.9.1 from 2013 is used in RHEL7. It probably doesn't
        # make much sense to test and support older versions.
        libxml2-version: [ 2.9.1, 2.9.14, 2.10.4, 2.11.9, 2.12.10, 2.13.9, 2.14.6, 2.15.3 ]

    steps:
      - uses: actions/checkout@v6
      - name: install libxml2
        run: |
          curl -L https://download.gnome.org/sources/libxml2/${LIBXML2_VERSION%.*}/libxml2-$LIBXML2_VERSION.tar.xz |tar xJf -
          cd libxml2-$LIBXML2_VERSION
          mkdir build
          cd build
          ../configure --without-python --prefix=$LIBXML2_INSTALL_DIR
          make -j$(nproc)
          make install
      - name: Install deps
        uses: perl-actions/install-with-cpanm@v1
        with:
          cpanfile: ".github/cpanfile"
      - run: perl Makefile.PL "INC=-I$LIBXML2_INSTALL_DIR/include/libxml2" "LIBS=-L$LIBXML2_INSTALL_DIR/lib -lxml2"
      - run: make -j$(nproc)
      - run: make test

  pod-drift:
    name: "POD drift check"
    needs: [author-testing, coverage, asan, downstream, linux, BSDs, fedora, macOS, windows]
    runs-on: ubuntu-latest

    env:
      PERL_USE_UNSAFE_INC: 0

    steps:
      - name: install libxml2-dev
        run: |
          sudo apt-get update -y ||:
          sudo apt-get --no-install-recommends -y install libxml2-dev
      - uses: actions/checkout@v6
      - name: Install deps
        uses: perl-actions/install-with-cpm@v2
        with:
          sudo: true
          cpanfile: ".github/cpanfile"
      - run: perl Makefile.PL
      - run: make -j$(nproc)
      - name: Check POD is up to date with docs/libxml.dbk
        run: |
          make pod_docs
          git diff --quiet -- LibXML.pod lib || {
            echo "::error::POD is out of sync with docs/libxml.dbk. Run 'make pod_docs' locally and commit the changes."
            git --no-pager diff --stat -- LibXML.pod lib
            exit 1
          }
